<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Für dich 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdeef5; --pink:#e0457b; --pink-dark:#c2185b; --pink-soft:#fde3ee;
    --key:#fcdbe8; --key-active:#f9c3d9; --purple:#d8b4fe; --purple-dark:#c084fc;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Quicksand',system-ui,sans-serif;background:var(--bg);color:var(--pink);
    overflow:hidden;user-select:none;-webkit-user-select:none;
  }
  .bg-hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .bg-hearts span{position:absolute;bottom:-40px;opacity:.35;animation:floatUp linear infinite}
  @keyframes floatUp{to{transform:translateY(-115vh) rotate(25deg)}}

  .screen{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:16px;opacity:0;pointer-events:none;transition:opacity .6s ease;z-index:1;
  }
  .screen.active{opacity:1;pointer-events:auto}

  #muteBtn{
    position:fixed;top:14px;right:14px;z-index:20;width:42px;height:42px;border-radius:50%;
    border:none;background:#fff;color:var(--pink);font-size:18px;box-shadow:0 4px 14px rgba(224,69,123,.2);cursor:pointer;
  }

  /* ---------- Schritt 1: Datum ---------- */
  .card{
    background:#fff;border-radius:22px;padding:28px 22px 24px;width:100%;max-width:340px;
    box-shadow:0 12px 40px rgba(224,69,123,.18);text-align:center;
  }
  .card h1{font-size:22px;font-weight:700;color:var(--pink-dark)}
  .hint{font-size:11px;letter-spacing:2px;color:#e99bb9;margin-top:6px}
  .slots{display:flex;justify-content:center;gap:8px;margin:20px 0 22px}
  .slot{width:24px;height:30px;border-bottom:2px solid #f6b8cf;display:flex;align-items:flex-end;justify-content:center;font-size:18px;line-height:1}
  .slot.gap{margin-right:8px}
  .slot.filled::after{content:'❤️';animation:pop .25s ease}
  @keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .key{
    height:52px;border:none;border-radius:26px;background:var(--key);color:var(--pink-dark);
    font-family:inherit;font-size:20px;font-weight:600;cursor:pointer;transition:transform .1s,background .15s;
  }
  .key:active{transform:scale(.93);background:var(--key-active)}
  .key.empty{visibility:hidden}
  .key.back{background:var(--pink-soft);color:#e99bb9}
  .shake{animation:shake .45s}
  @keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
  .err{height:18px;margin-top:12px;font-size:13px;color:#e99bb9}

  /* ---------- Schritt 2: Geschenk ---------- */
  .gift{
    position:relative;width:190px;height:190px;border-radius:16px;background:var(--purple);
    box-shadow:0 14px 40px rgba(168,85,247,.3);display:flex;align-items:center;justify-content:center;
    font-size:64px;cursor:pointer;animation:idle 2.2s ease-in-out infinite;
  }
  .gift::before,.gift::after{content:'';position:absolute;background:var(--purple-dark)}
  .gift::before{left:50%;top:0;bottom:0;width:30px;transform:translateX(-50%)}
  .gift::after{top:50%;left:0;right:0;height:30px;transform:translateY(-50%)}
  .gift span{position:relative;z-index:1}
  @keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .gift.wiggle{animation:wiggle .35s ease-in-out infinite}
  @keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
  .gift.boom{animation:boom .5s forwards}
  @keyframes boom{to{transform:scale(1.6);opacity:0}}
  .bar{width:190px;height:6px;border-radius:3px;background:#fbe3ee;margin-top:28px;overflow:hidden}
  .bar div{height:100%;width:0;background:linear-gradient(90deg,#f9a8d4,var(--pink));transition:width 1.8s linear}
  .tap{margin-top:16px;font-size:15px;font-weight:600;color:#e99bb9}

  /* ---------- Schritt 3: Brief ---------- */
  .env-wrap{transition:transform .6s ease,opacity .6s ease}
  .env-wrap.hidden{opacity:0;transform:scale(.8)}
  .envelope{position:relative;width:300px;height:190px;perspective:900px;transform:rotate(-2deg)}
  .env-back{position:absolute;inset:0;background:#f9a8d4;border-radius:10px;box-shadow:0 14px 34px rgba(224,69,123,.25)}
  .paper{
    position:absolute;left:16px;right:16px;top:10px;height:168px;background:#fff;border-radius:6px;z-index:2;
    transition:transform .9s cubic-bezier(.4,0,.2,1);display:flex;align-items:flex-start;justify-content:center;
    padding-top:18px;font-weight:700;color:var(--pink);font-size:15px;
  }
  .envelope.out .paper{transform:translateY(-120px)}
  .env-front{
    position:absolute;inset:0;z-index:3;border-radius:10px;background:#fbb6d6;
    clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);
  }
  .flap{
    position:absolute;left:0;right:0;top:0;height:62%;z-index:4;background:#f472b6;
    clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .6s ease;
  }
  .envelope.flap-open .flap{transform:rotateX(180deg)}
  .envelope.flap-back .flap{z-index:1}
  .seal{
    position:absolute;left:50%;top:62%;width:44px;height:44px;margin:-22px 0 0 -22px;z-index:5;border-radius:50%;
    background:#ef3b4c;border:3px solid #fff4f6;box-shadow:0 3px 10px rgba(0,0,0,.2);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;cursor:pointer;
    transition:opacity .3s,transform .3s;animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
  .envelope.flap-open .seal{opacity:0;pointer-events:none}

  .letter{
    position:fixed;left:50%;top:50%;width:calc(100% - 32px);max-width:340px;
    transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;transition:all .5s ease;
    background:#fff;border-radius:18px;padding:30px 22px;text-align:center;
    box-shadow:0 14px 44px rgba(224,69,123,.22);z-index:5;
  }
  .letter.show{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
  .letter .small{font-size:14px;color:#e99bb9;font-weight:600}
  .letter h2{font-size:26px;color:var(--pink-dark);margin:10px 0 4px}
  .letter p{font-size:17px;font-weight:600}
  .btns{position:relative;height:60px;margin-top:26px}
  .btn{
    position:absolute;top:0;height:50px;padding:0 26px;border:none;border-radius:25px;font-family:inherit;
    font-size:18px;font-weight:700;cursor:pointer;transition:transform .15s;
  }
  #yes{left:calc(50% - 120px);background:var(--pink);color:#fff;box-shadow:0 6px 18px rgba(224,69,123,.35)}
  #yes:active{transform:scale(.94)}
  #no{left:calc(50% + 20px);background:var(--key);color:var(--pink-dark);transition:left .25s,top .25s}
  #no.flee{position:fixed;z-index:30}

  /* ---------- Schritt 4: Nachricht ---------- */
  .final{max-width:360px;text-align:center}
  .big-heart{font-size:70px;animation:beat 1.2s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
  .final p{margin-top:22px;font-size:22px;font-weight:700;line-height:1.5;color:var(--pink-dark)}
  .final p span{display:inline-block;opacity:0;transform:translateY(8px);transition:all .5s ease}
  .final p span.in{opacity:1;transform:none}
  .final .sign{margin-top:18px;font-size:30px}

  /* ---------- Menü + Unterseiten ---------- */
  #s-final,.sub{overflow-y:auto;justify-content:flex-start;padding-top:max(60px,10vh);padding-bottom:40px}
  .menu{display:flex;flex-direction:column;gap:12px;margin-top:30px;width:100%;max-width:340px;
    opacity:0;transform:translateY(14px);transition:all .7s ease;pointer-events:none}
  .menu.in{opacity:1;transform:none}
  .screen.active .menu.in{pointer-events:auto}
  .opt{display:flex;align-items:center;gap:14px;background:#fff;border:none;border-radius:18px;padding:16px 18px;
    font-family:inherit;text-align:left;cursor:pointer;box-shadow:0 8px 24px rgba(224,69,123,.15);transition:transform .15s}
  .opt:active{transform:scale(.97)}
  .opt .ico{font-size:30px}
  .opt b{display:block;font-size:17px;color:var(--pink-dark)}
  .opt small{font-size:13px;color:#e99bb9;font-weight:600}
  .opt.locked{opacity:.6;cursor:default}

  .sub-head{width:100%;max-width:420px;display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .back-btn{width:42px;height:42px;border-radius:50%;border:none;background:#fff;color:var(--pink);font-size:20px;
    box-shadow:0 4px 14px rgba(224,69,123,.2);cursor:pointer;flex-shrink:0}
  .sub-head h2{font-size:24px;color:var(--pink-dark)}

  .photos{width:100%;max-width:420px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .photo{aspect-ratio:1;border-radius:16px;background:#fff;overflow:hidden;position:relative;cursor:pointer;
    box-shadow:0 6px 18px rgba(224,69,123,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#e99bb9;font-size:13px;font-weight:600;gap:6px}
  .photo:nth-child(odd){transform:rotate(-1.5deg)} .photo:nth-child(even){transform:rotate(1.5deg)}
  .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .photo .cap{position:absolute;left:0;right:0;bottom:0;padding:8px;background:linear-gradient(transparent,rgba(0,0,0,.5));color:#fff;font-size:12px}
  .photo .ph{font-size:28px}
  .lightbox{position:fixed;inset:0;background:rgba(60,10,30,.85);z-index:50;display:none;flex-direction:column;
    align-items:center;justify-content:center;padding:20px;color:#fff;text-align:center}
  .lightbox.show{display:flex}
  .lb-x{position:absolute;top:14px;right:14px;width:42px;height:42px;border-radius:50%;border:none;background:#fff;color:var(--pink);font-size:18px;cursor:pointer}
    box-shadow:0 6px 18px rgba(224,69,123,.13);transition:transform .15s}
  .lightbox img{max-width:100%;max-height:75vh;border-radius:14px}
  .lightbox p{margin-top:14px;font-weight:600}

  .counter{width:100%;max-width:420px;background:var(--pink);color:#fff;border-radius:20px;padding:20px;text-align:center;
    box-shadow:0 10px 28px rgba(224,69,123,.3);margin-bottom:18px}
  .counter .num{font-size:44px;font-weight:700;line-height:1.1}
  .counter small{font-size:14px;font-weight:600;opacity:.9}
  .dates{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
  .date{display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 6px 18px rgba(224,69,123,.12)}
  .date .ico{font-size:28px}
  .date b{display:block;color:var(--pink-dark);font-size:16px}
  .date div span{font-size:14px;font-weight:600}
  .date em{display:block;font-style:normal;font-size:12px;color:#e99bb9;font-weight:600;margin-top:2px}

  .pack-btn{align-self:center;border:none;background:#fff;color:var(--pink-dark);font-family:inherit;font-weight:700;
    font-size:15px;padding:10px 20px;border-radius:22px;box-shadow:0 4px 14px rgba(224,69,123,.2);cursor:pointer;margin-bottom:26px}
  .pack-btn:active{transform:scale(.95)}
  .love{max-width:340px;text-align:center;font-size:26px;line-height:1.35;color:var(--pink-dark);font-weight:700}
  .love span{display:block;font-size:32px;color:var(--pink);letter-spacing:1px;animation:beat 1.6s ease-in-out infinite}
  .menu{margin-top:26px}
  .engage{width:100%;max-width:420px;margin-top:16px;display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:18px;
    background:linear-gradient(135deg,#fff,#fde3ee);border:2px dashed #f6b8cf;color:var(--pink-dark)}
  .engage .ring{font-size:38px;animation:beat 1.8s ease-in-out infinite}
  .engage b{display:block;font-size:18px}
  .engage small{font-size:14px;font-weight:600;color:#e99bb9}

  .burst{position:fixed;pointer-events:none;z-index:40;font-size:22px;animation:burst 1.4s ease-out forwards}
  @keyframes burst{to{transform:translate(var(--x),var(--y)) scale(.4) rotate(var(--r));opacity:0}}
</style>
</head>
<body>

<div class="bg-hearts" id="bgHearts"></div>

<!-- 1: Datum -->
<section class="screen active" id="s-lock">
  <div class="card" id="lockCard">
    <h1>Gib unser besonderes Datum ein</h1>
    <div class="hint">TT MM JJJJ</div>
    <div class="slots" id="slots"></div>
    <div class="keypad" id="keypad"></div>
    <div class="err" id="err"></div>
  </div>
</section>

<!-- 2: Geschenk -->
<section class="screen" id="s-gift">
  <div class="gift" id="gift"><span>🎁</span></div>
  <div class="bar"><div id="barFill"></div></div>
  <div class="tap" id="tapText">Tipp mich an</div>
</section>

<!-- 3: Brief -->
<section class="screen" id="s-letter">
  <div class="env-wrap" id="envWrap">
    <div class="envelope" id="envelope">
      <div class="env-back"></div>
      <div class="paper">Für dich 💌</div>
      <div class="env-front"></div>
      <div class="flap"></div>
      <div class="seal" id="seal">❤</div>
    </div>
  </div>
  <div class="tap" id="sealHint" style="margin-top:34px">Öffne mich</div>

</section>

<!-- 4: Nachricht -->
<section class="screen" id="s-final">
  <button class="pack-btn" id="packBtn">✉️ Einpacken</button>
  <h1 class="love">Ich liebe dich mehr als <span>ALLES ANDERE</span></h1>
  <div class="menu in" id="menu">
    <button class="opt" data-go="s-memories"><span class="ico">📸</span><span><b>Erinnerungen</b><small>Bilder von uns</small></span></button>
    <button class="opt" data-go="s-dates"><span class="ico">📅</span><span><b>Unsere Daten</b><small>Die wichtigsten Tage</small></span></button>
    <button class="opt locked" id="optSoon"><span class="ico">🎁</span><span><b>Überraschung</b><small>Ab ca. 21 Uhr verfügbar ⏳</small></span></button>
    <button class="opt locked" id="opt3"><span class="ico">🔒</span><span><b>Coming soon</b><small>Da kommt noch mehr …</small></span></button>
  </div>
</section>

<!-- Erinnerungen -->
<section class="screen sub" id="s-memories">
  <div class="sub-head"><button class="back-btn" data-go="s-final">←</button><h2>Erinnerungen 📸</h2></div>
  <div class="photos" id="photos"></div>
</section>

<!-- Daten -->
<section class="screen sub" id="s-dates">
  <div class="sub-head"><button class="back-btn" data-go="s-final">←</button><h2>Unsere Daten 📅</h2></div>
  <div class="counter"><div class="num" id="dayCount">0</div><small>Tage zusammen 💕</small></div>
  <div class="dates" id="dates"></div>
  <div class="engage"><span class="ring">💍</span><div><b>Verlobung</b><small>Coming soon …</small></div></div>
</section>

<div class="lightbox" id="lightbox"><button class="lb-x" aria-label="Schließen">✕</button><img id="lbImg" alt=""><p id="lbCap"></p></div>

<script>
(function(){
  const CODE = '10042026';
  const $ = id => document.getElementById(id);
  const wait = ms => new Promise(r => setTimeout(r, ms));

  /* Hintergrund-Herzen */
  const bg = $('bgHearts');
  for (let i = 0; i < 14; i++) {
    const s = document.createElement('span');
    s.textContent = ['💗','💕','🤍','💖'][i % 4];
    s.style.left = Math.random() * 100 + '%';
    s.style.fontSize = 12 + Math.random() * 16 + 'px';
    s.style.animationDuration = 9 + Math.random() * 10 + 's';
    s.style.animationDelay = -Math.random() * 18 + 's';
    bg.appendChild(s);
  }

  function startMusic(){}

  function show(id){
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $(id).classList.add('active');
  }

  function burst(x, y, n = 18){
    for (let i = 0; i < n; i++) {
      const h = document.createElement('span');
      h.className = 'burst';
      h.textContent = ['❤️','💖','💕','✨'][i % 4];
      h.style.left = x + 'px'; h.style.top = y + 'px';
      const a = Math.random() * Math.PI * 2, d = 80 + Math.random() * 140;
      h.style.setProperty('--x', Math.cos(a) * d + 'px');
      h.style.setProperty('--y', Math.sin(a) * d + 'px');
      h.style.setProperty('--r', (Math.random() * 360 - 180) + 'deg');
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 1500);
    }
  }

  /* ---------- 1: Datum ---------- */
  const slots = $('slots');
  for (let i = 0; i < 8; i++) {
    const s = document.createElement('div');
    s.className = 'slot' + (i === 1 || i === 3 ? ' gap' : '');
    slots.appendChild(s);
  }
  const keys = ['1','2','3','4','5','6','7','8','9','','0','←'];
  keys.forEach(k => {
    const b = document.createElement('button');
    b.className = 'key' + (k === '' ? ' empty' : '') + (k === '←' ? ' back' : '');
    b.textContent = k;
    b.addEventListener('click', () => press(k));
    $('keypad').appendChild(b);
  });

  let input = '', locked = false;
  function render(){
    [...slots.children].forEach((s, i) => s.classList.toggle('filled', i < input.length));
  }
  async function press(k){
    startMusic();
    if (locked) return;
    $('err').textContent = '';
    if (k === '←') { input = input.slice(0, -1); render(); return; }
    if (input.length >= 8) return;
    input += k; render();
    if (input.length === 8) {
      locked = true;
      await wait(300);
      if (input === CODE) {
        const r = $('lockCard').getBoundingClientRect();
        burst(r.left + r.width / 2, r.top + r.height / 2, 24);
        await wait(500);
        show('s-gift');
      } else {
        $('lockCard').classList.add('shake');
        $('err').textContent = 'Hmm, nicht ganz … versuch’s nochmal 💭';
        await wait(450);
        $('lockCard').classList.remove('shake');
        input = ''; render(); locked = false;
      }
    }
  }

  /* ---------- 2: Geschenk ---------- */
  let giftOpening = false;
  $('gift').addEventListener('click', async () => {
    startMusic();
    if (giftOpening) return;
    giftOpening = true;
    $('tapText').textContent = 'Wird ausgepackt …';
    $('gift').classList.add('wiggle');
    $('barFill').style.width = '100%';
    await wait(1850);
    const r = $('gift').getBoundingClientRect();
    $('gift').classList.remove('wiggle');
    $('gift').classList.add('boom');
    burst(r.left + r.width / 2, r.top + r.height / 2, 26);
    await wait(650);
    show('s-letter');
  });

  /* ---------- 3: Brief ---------- */
  const env = $('envelope');
  let busy = false;
  async function openLetter(){
    if (busy) return;
    busy = true;
    $('sealHint').style.opacity = 0;
    env.classList.add('flap-open');
    await wait(600);
    env.classList.add('flap-back');
    env.classList.add('out');
    await wait(1000);
    const r = env.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top, 26);
    $('envWrap').classList.add('hidden');
    await wait(450);
    show('s-final');
    $('s-final').scrollTop = 0;
    busy = false;
  }
  async function closeLetter(){
    if (busy) return;
    busy = true;
    show('s-letter');
    await wait(500);
    $('envWrap').classList.remove('hidden');
    await wait(600);
    env.classList.remove('out');
    await wait(950);
    env.classList.remove('flap-back');
    env.classList.remove('flap-open');
    await wait(600);
    $('sealHint').style.opacity = 1;
    busy = false;
  }
  $('seal').addEventListener('click', openLetter);
  $('packBtn').addEventListener('click', closeLetter);

  const PLACEHOLDERS = 0;

  const TOGETHER = '2026-04-10';
  const DATES = [
    { ico: '💞', title: 'Zusammengekommen', date: '2026-04-10' },
    { ico: '💋', title: 'Erster Kuss',       date: '2026-04-06' },
    { ico: '🍝', title: 'Erstes Date',       date: '2026-04-07' },
    { ico: '🎂', title: 'Dein Geburtstag',   date: '--11-26', birthday: true },
    { ico: '🎂', title: 'Mein Geburtstag',   date: '--08-20', birthday: true },
  ];

  /* ---------- Navigation ---------- */
  document.querySelectorAll('[data-go]').forEach(b =>
    b.addEventListener('click', () => { show(b.dataset.go); $(b.dataset.go).scrollTop = 0; }));
  $('opt3').addEventListener('click', () => {
    const r = $('opt3').getBoundingClientRect(); burst(r.left + 40, r.top + r.height / 2, 8);
  });

  /* Erinnerungen */
  const grid = $('photos');
  PHOTOS.forEach(p => {
    const d = document.createElement('div');
    d.className = 'photo';
    d.innerHTML = '<img alt="">' + (p.text ? '<div class="cap"></div>' : '');
    d.querySelector('img').src = p.src;
    if (p.text) d.querySelector('.cap').textContent = p.text;
    d.addEventListener('click', () => {
      $('lbImg').src = p.src; $('lbCap').textContent = p.text || '';
      $('lightbox').classList.add('show');
    });
    grid.appendChild(d);
  });
  for (let i = PHOTOS.length; i < PLACEHOLDERS; i++) {
    const d = document.createElement('div');
    d.className = 'photo';
    d.innerHTML = '<span class="ph">📷</span>Bild folgt';
    grid.appendChild(d);
  }
  $('lightbox').addEventListener('click', () => $('lightbox').classList.remove('show'));


  /* Daten */
  const today = new Date(); today.setHours(0,0,0,0);
  const DAY = 86400000;
  const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const fmt = d => String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth() + 1).padStart(2,'0') + '.';
  $('dayCount').textContent = Math.max(0, Math.round((today - parse(TOGETHER)) / DAY));
  DATES.forEach(x => {
    let dateTxt, info;
    if (x.birthday) {
      const [m, d] = x.date.replace('--', '').split('-').map(Number);
      let next = new Date(today.getFullYear(), m - 1, d);
      if (next < today) next = new Date(today.getFullYear() + 1, m - 1, d);
      const left = Math.round((next - today) / DAY);
      dateTxt = fmt(next);
      info = left === 0 ? 'Heute! 🎉' : 'noch ' + left + (left === 1 ? ' Tag' : ' Tage');
    } else {
      const dt = parse(x.date);
      dateTxt = fmt(dt) + dt.getFullYear();
      const diff = Math.round((today - dt) / DAY);
      info = diff === 0 ? 'Heute! 🎉' : diff > 0 ? 'vor ' + diff + ' Tagen' : 'in ' + (-diff) + ' Tagen';
    }
    const el = document.createElement('div');
    el.className = 'date';
    el.innerHTML = '<span class="ico"></span><div><b></b><span class="d"></span><em></em></div>';
    el.querySelector('.ico').textContent = x.ico;
    el.querySelector('b').textContent = x.title;
    el.querySelector('.d').textContent = dateTxt;
    el.querySelector('em').textContent = info;
    $('dates').appendChild(el);
  });

})();
</script>
