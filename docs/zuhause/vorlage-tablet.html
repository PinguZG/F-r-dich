<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Vorlage 2 – Rosé-Nacht</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#140a16;--card:rgba(255,255,255,.05);--line:rgba(255,200,230,.10);--txt:#fbeef5;--mut:#b49aaf;--pink:#ff6fb5;--lila:#c49bff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;background:#0a050b;overflow:hidden;font-family:Quicksand,system-ui,sans-serif;color:var(--txt)}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.stage{width:1180px;height:820px;position:absolute;left:50%;top:50%;overflow:hidden;border-radius:28px;padding:26px;
  background:radial-gradient(700px 520px at 30% 55%,rgba(255,111,181,.16),transparent 65%),radial-gradient(600px 500px at 100% 0%,rgba(196,155,255,.16),transparent 60%),radial-gradient(500px 400px at 0% 100%,rgba(255,140,120,.10),transparent 60%),var(--bg);
  display:grid;grid-template-columns:1fr 340px;grid-template-rows:100%;gap:22px}
.left{display:grid;grid-template-rows:auto 1fr auto;min-height:0}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.hello{font-size:19px;color:var(--mut);font-weight:500}
.clock{font-size:104px;font-weight:300;letter-spacing:-3px;line-height:1;margin-top:2px;background:linear-gradient(180deg,#fff,#f4c6de);-webkit-background-clip:text;color:transparent}
.sub{display:flex;flex-direction:column;gap:12px;align-items:flex-start;white-space:nowrap;color:var(--mut);font-size:17px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(255,111,181,.12);color:#ffc2df;font-weight:600;font-size:15px}
.chip svg{width:18px;height:18px}
.nav{display:flex;gap:8px;padding:6px;border-radius:24px;background:var(--card);border:1px solid var(--line)}
.nav div{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;color:var(--mut)}
.nav .on{color:#fff;background:linear-gradient(160deg,var(--pink),#b45cff);box-shadow:0 8px 24px -6px rgba(255,111,181,.7)}
/* orbs */
.orbs{display:flex;align-items:center;justify-content:space-around;padding:0 10px}
.orb{display:grid;justify-items:center;gap:14px;cursor:pointer;touch-action:none}
.ring{--c:#ffb38a;width:196px;height:196px;border-radius:50%;position:relative;display:grid;place-items:center;transition:.4s}
.ring svg.arc{position:absolute;inset:0;width:100%;height:100%;transform:rotate(135deg)}
.arc .tr{stroke:rgba(255,255,255,.07);stroke-width:7}
.orb:not(.on) .arc .v{opacity:0}.arc .v{stroke:var(--c);stroke-width:7;transition:stroke-dasharray .25s;filter:drop-shadow(0 0 8px var(--c))}
.core{width:146px;height:146px;border-radius:50%;display:grid;place-items:center;transition:.4s;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.10),rgba(255,255,255,.02) 60%);border:1px solid var(--line);color:var(--mut)}
.core svg{width:44px;height:44px}
.orb.on .core{color:#2a0f1c;background:radial-gradient(circle at 35% 30%,#fff 0%,var(--c) 45%,color-mix(in srgb,var(--c) 60%,#000) 100%);border-color:transparent;
  box-shadow:0 0 50px 4px color-mix(in srgb,var(--c) 65%,transparent),0 0 140px 30px color-mix(in srgb,var(--c) 28%,transparent)}
.orb h3{font-size:21px;font-weight:600}.orb p{font-size:16px;color:var(--mut);margin-top:-8px}
/* scenes */
.scenes{display:flex;gap:12px}
.sc{flex:1;height:76px;border-radius:24px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:17px;font-weight:600;cursor:pointer;
  background:var(--card);border:1px solid var(--line);color:#f3dbe8;transition:.35s;white-space:nowrap}
.sc svg{color:var(--a)}
.sc.on{background:linear-gradient(135deg,color-mix(in srgb,var(--a) 70%,transparent),color-mix(in srgb,var(--b) 55%,transparent));border-color:transparent;color:#fff;box-shadow:0 14px 36px -12px var(--a)}
.sc.on svg{color:#fff}
/* right */
.right{display:grid;grid-template-rows:auto auto 1fr;gap:18px;min-height:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:20px 22px;backdrop-filter:blur(18px);min-height:0;overflow:hidden}
.ttl{font-size:15px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:10px}.ttl svg{width:18px;height:18px}
.w{display:flex;align-items:center;gap:16px}
.w svg{width:58px;height:58px;color:#ffc6a8;filter:drop-shadow(0 0 16px rgba(255,170,140,.6))}
.big{font-size:48px;font-weight:600;line-height:1}
.hours{display:flex;justify-content:space-between;margin-top:16px;font-size:14px;color:var(--mut)}
.hours div{display:grid;justify-items:center;gap:5px}.hours b{color:var(--txt);font-size:15px}.hours svg{width:20px;height:20px;color:#ffc6a8}
.t{display:flex;justify-content:space-between;align-items:flex-end}
.t small{font-size:22px;color:var(--mut)}
.spark{width:150px;height:56px}
.spark .l{stroke:var(--lila);stroke-width:2.5;filter:drop-shadow(0 0 6px rgba(196,155,255,.8))}
.rt{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.rt:first-of-type{border-top:0}
.rt h4{font-size:16px;font-weight:600}.rt p{font-size:14px;color:var(--mut)}
.ri{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:rgba(196,155,255,.14);color:var(--lila)}
.sw{margin-left:auto;width:56px;height:32px;border-radius:20px;background:rgba(255,255,255,.12);position:relative;cursor:pointer;transition:.3s;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.3s}
.sw.on{background:linear-gradient(90deg,var(--pink),#b45cff);box-shadow:0 0 16px rgba(255,111,181,.5)}.sw.on::after{left:28px}
.all{margin-left:auto}
</style>
</head>
<body>
<div class="stage" id="stage">
  <section class="left">
    <div class="top">
      <div>
        <div class="hello" id="hello">Guten Abend, ihr zwei</div>
        <div class="clock" id="clock">19:42</div>
        <div class="sub"><span id="date">Mittwoch, 4. November</span><span class="chip"><i data-i="heart"></i><span id="days">208</span> Tage zusammen · Wiedersehen in 9 Tagen</span></div>
      </div>
      <div class="nav"><div class="on" data-i="home"></div><div data-i="spark"></div><div data-i="clock"></div><div data-i="gear"></div></div>
    </div>
    <div class="orbs" id="orbs"></div>
    <div class="scenes" id="scenes"></div>
  </section>
  <aside class="right">
    <div class="card">
      <div class="ttl"><i data-i="pin"></i>Kiel</div>
      <div class="w"><i data-i="cloudsun"></i><div><div class="big">9°</div><div style="color:var(--mut);font-size:15px;margin-top:4px">Leicht bewölkt · gefühlt 6°</div></div></div>
      <div class="hours" id="hours"></div>
    </div>
    <div class="card">
      <div class="ttl"><i data-i="thermo"></i>Zimmer</div>
      <div class="t"><div><div class="big">21,4<small>°C</small></div><div style="color:var(--mut);font-size:15px;margin-top:6px">Luftfeuchte 48 %</div></div><svg class="spark" id="spark" viewBox="0 0 150 56" preserveAspectRatio="none"></svg></div>
    </div>
    <div class="card">
      <div class="ttl"><i data-i="clock"></i>Routinen</div>
      <div id="routines"></div>
    </div>
  </aside>
</div>
<script>
const I={home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/>',moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',film:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14M17 5v14M3 9h4M3 15h4M17 9h4M17 15h4"/>',book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19V5"/>',flame:'<path d="M12 2c3 4 6 6 6 11a6 6 0 0 1-12 0c0-3 1.5-4.5 3-6 0 2.5 1.5 4 3 4 0-4-1.5-6.5 0-9z"/>',power:'<path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/>',heart:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',thermo:'<path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/>',cloudsun:'<path d="M8 3v1M3.5 5.5l.7.7M2 10h1M12.5 5.5l-.7.7M5.5 10a3 3 0 0 1 5.6-1.5"/><path d="M7 20h10a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 7.2 13 3.5 3.5 0 0 0 7 20z"/>',cloud:'<path d="M7 19h10a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 7.2 12 3.5 3.5 0 0 0 7 19z"/>',sunrise:'<path d="M12 3v4M5 10l1.5 1.5M19 10l-1.5 1.5M3 17h18M7 17a5 5 0 0 1 10 0M8 21h8"/>',pin:'<path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>'};
const svg=n=>`<svg viewBox="0 0 24 24">${I[n]}</svg>`;
document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=svg(e.dataset.i));

const lamps=[{n:'Stehlampe',c:'#ffb38a',on:true,b:70},{n:'Deckenlicht',c:'#ffe1c9',on:false,b:45},{n:'LED-Streifen',c:'#ff5fa8',on:true,b:58}];
const O=document.getElementById('orbs'),C=2*Math.PI*90,ARC=C*0.75;
function render(){O.innerHTML=lamps.map((l,i)=>`<div class="orb ${l.on?'on':''}" data-i="${i}"><div class="ring" style="--c:${l.c}">
 <svg class="arc" viewBox="0 0 196 196"><circle class="tr" cx="98" cy="98" r="90" stroke-dasharray="${ARC} ${C}"/><circle class="v" cx="98" cy="98" r="90" stroke-dasharray="${l.on?ARC*l.b/100:0} ${C}"/></svg>
 <div class="core">${svg('bulb')}</div></div><h3>${l.n}</h3><p>${l.on?l.b+' %':'Aus'}</p></div>`).join('')}
let d=null;
O.addEventListener('pointerdown',e=>{const t=e.target.closest('.orb');if(!t)return;d={t,y:e.clientY,b:lamps[t.dataset.i].b,m:false};t.setPointerCapture(e.pointerId)});
O.addEventListener('pointermove',e=>{if(!d)return;const dy=d.y-e.clientY;if(Math.abs(dy)>8)d.m=true;if(!d.m)return;const l=lamps[d.t.dataset.i];l.on=true;l.b=Math.max(1,Math.min(100,Math.round(d.b+dy/2)));
  d.t.classList.add('on');d.t.querySelector('p').textContent=l.b+' %';d.t.querySelector('.v').setAttribute('stroke-dasharray',`${ARC*l.b/100} ${C}`)});
O.addEventListener('pointerup',()=>{if(!d)return;if(!d.m){const l=lamps[d.t.dataset.i];l.on=!l.on}d=null;render()});
render();

const sc=[['Gemütlich','flame','#ff8a7a','#ff5fa8'],['Filmabend','film','#b45cff','#5b3cff'],['Lesen','book','#ffd0a8','#ff9a7a'],['Gute Nacht','moon','#8f7bff','#c49bff'],['Alles aus','power','#9a8394','#5a4a57']];
const S=document.getElementById('scenes');
S.innerHTML=sc.map((s,i)=>`<div class="sc ${i==0?'on':''}" style="--a:${s[2]};--b:${s[3]}">${svg(s[1])}<span>${s[0]}</span></div>`).join('');
S.onclick=e=>{const t=e.target.closest('.sc');if(t)S.querySelectorAll('.sc').forEach(x=>x.classList.toggle('on',x===t))};

const rts=[['Sanft wecken','Mo–Fr · 6:00','sunrise',true],['Abends dimmen','täglich · 22:00','moon',true],['Gute-Nacht-Timer','Licht aus nach 30 Min','clock',false],['Willkommen','Licht an bei Ankunft','home',false]];
const R=document.getElementById('routines');
R.innerHTML=rts.map(r=>`<div class="rt"><div class="ri">${svg(r[2])}</div><div><h4>${r[0]}</h4><p>${r[1]}</p></div><div class="sw ${r[3]?'on':''}"></div></div>`).join('');
R.onclick=e=>{const s=e.target.closest('.sw');if(s)s.classList.toggle('on')};

document.getElementById('hours').innerHTML=[['20','cloud',8],['21','cloud',8],['22','cloud',7],['23','cloudsun',7],['0','cloud',6]].map(h=>`<div>${h[0]} Uhr${svg(h[1])}<b>${h[2]}°</b></div>`).join('');
const t=[20.1,19.9,19.8,19.9,20.3,20.9,21.3,21.6,21.8,22.0,22.1,21.9,21.7,21.5,21.6,21.8,21.7,21.4];
const p='M'+t.map((v,i)=>`${(i/(t.length-1)*150).toFixed(1)},${(52-(v-19.6)/2.6*48).toFixed(1)}`).join(' L');
document.getElementById('spark').innerHTML=`<path class="l" d="${p}"/>`;

function tick(){const n=new Date();document.getElementById('clock').textContent=n.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
 document.getElementById('date').textContent=n.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
 const h=n.getHours();document.getElementById('hello').textContent=(h<11?'Guten Morgen':h<17?'Hallo':h<22?'Guten Abend':'Gute Nacht')+', ihr zwei';
 document.getElementById('days').textContent=Math.floor((n-new Date(2026,3,10))/864e5)}
tick();setInterval(tick,10000);
function fit(){const s=Math.min(innerWidth/1180,innerHeight/820);document.getElementById('stage').style.transform=`translate(-50%,-50%) scale(${s})`}
fit();addEventListener('resize',fit);
</script>
</body>
</html>
