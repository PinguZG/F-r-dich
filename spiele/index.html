<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spiele sind jetzt in Wir 💌</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Quicksand,system-ui,sans-serif;
    background:linear-gradient(165deg,#fff4f8,#fde3ee 55%,#f8cfe2);color:#b8165a;text-align:center;padding:24px;box-sizing:border-box}
  a{display:inline-block;margin-top:18px;padding:14px 26px;border-radius:26px;background:linear-gradient(135deg,#f88fb5,#e0457b);color:#fff;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div>
  <div style="font-size:54px">🎲💌</div>
  <h1>Die Spiele sind wieder in Wir</h1>
  <p>Öffne einfach die Wir-App – unten unter „Spiele“.<br>Dieses Symbol kannst du vom Home-Bildschirm löschen.</p>
  <a href="https://wir.geep-flops.ts.net/#go=s-games">Wir öffnen</a>
</div>
<script>
  // alten Service Worker der Spiele-App entfernen
  navigator.serviceWorker?.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
  window.caches?.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});
  setTimeout(() => { location.href = 'https://wir.geep-flops.ts.net/#go=s-games'; }, 2500);
</script>
</body>
</html>
